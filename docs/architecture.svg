<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="980" height="520" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
  <g fill="#f4f1ea" stroke="#333" stroke-width="1.5">
    <rect x="20" y="30" width="200" height="90" rx="8"/>
    <rect x="290" y="30" width="200" height="90" rx="8"/>
    <rect x="560" y="30" width="200" height="90" rx="8"/>
    <rect x="290" y="190" width="200" height="90" rx="8"/>
    <rect x="560" y="190" width="200" height="90" rx="8"/>
    <rect x="20" y="360" width="200" height="110" rx="8"/>
    <rect x="290" y="360" width="200" height="110" rx="8"/>
    <rect x="560" y="360" width="200" height="110" rx="8"/>
    <rect x="800" y="360" width="160" height="110" rx="8" fill="#e3f0e3"/>
  </g>
  <g fill="#111">
    <text x="120" y="60" text-anchor="middle" font-weight="bold">1. Schedule</text>
    <text x="120" y="82" text-anchor="middle">400 runs, 5 conditions</text>
    <text x="120" y="102" text-anchor="middle">which page lies: fixed seed</text>
    <text x="390" y="60" text-anchor="middle" font-weight="bold">2. Harness (ours)</text>
    <text x="390" y="82" text-anchor="middle">asks the model the question</text>
    <text x="390" y="102" text-anchor="middle">runs its fetch_url calls</text>
    <text x="660" y="60" text-anchor="middle" font-weight="bold">Meta Model API</text>
    <text x="660" y="82" text-anchor="middle">muse-spark-1.3</text>
    <text x="660" y="102" text-anchor="middle">(not the Muse agent)</text>
    <text x="390" y="220" text-anchor="middle" font-weight="bold">Test shop (static site)</text>
    <text x="390" y="242" text-anchor="middle">two seller pages per run</text>
    <text x="390" y="262" text-anchor="middle">one may carry a false claim</text>
    <text x="660" y="220" text-anchor="middle" font-weight="bold">Server log</text>
    <text x="660" y="242" text-anchor="middle">time, page, visitor name</text>
    <text x="660" y="262" text-anchor="middle">proves what was fetched</text>
    <text x="120" y="390" text-anchor="middle" font-weight="bold">3. Transcripts</text>
    <text x="120" y="412" text-anchor="middle">one file per run:</text>
    <text x="120" y="432" text-anchor="middle">request, page text returned,</text>
    <text x="120" y="452" text-anchor="middle">answer, tokens</text>
    <text x="390" y="390" text-anchor="middle" font-weight="bold">4. Reading the answers</text>
    <text x="390" y="412" text-anchor="middle">judge (Claude Sonnet) reads</text>
    <text x="390" y="432" text-anchor="middle">each answer 4 times, blind;</text>
    <text x="390" y="452" text-anchor="middle">code reader cross-checks</text>
    <text x="660" y="390" text-anchor="middle" font-weight="bold">5. Analysis</text>
    <text x="660" y="412" text-anchor="middle">picks per condition vs control,</text>
    <text x="660" y="432" text-anchor="middle">ranges, fetch proof</text>
    <text x="660" y="452" text-anchor="middle">-> evidence file</text>
    <text x="880" y="390" text-anchor="middle" font-weight="bold">replay.py</text>
    <text x="880" y="412" text-anchor="middle">redoes 4 and 5</text>
    <text x="880" y="432" text-anchor="middle">from saved files,</text>
    <text x="880" y="452" text-anchor="middle">no key, no network</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M220,75 L288,75"/>
    <path d="M490,60 L558,60"/>
    <path d="M558,95 L492,95"/>
    <path d="M390,120 L390,188"/>
    <path d="M490,235 L558,235"/>
    <path d="M330,120 C250,220 150,280 120,358"/>
    <path d="M220,415 L288,415"/>
    <path d="M490,415 L558,415"/>
    <path d="M660,280 L660,358"/>
    <path d="M800,440 L762,440"/>
  </g>
  <g fill="#555" font-size="12">
    <text x="524" y="52" text-anchor="middle">question</text>
    <text x="524" y="112" text-anchor="middle">tool calls</text>
    <text x="400" y="158">fetches pages</text>
    <text x="524" y="227" text-anchor="middle">logs</text>
  </g>
</svg>
